[pytest]
# rootdir is the project root so `import mm_monitor` and `from tests...` both work.
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q
# Qt runs headless for the GUI smoke tests — conftest.py sets QT_QPA_PLATFORM
# to "offscreen" before PySide6 is imported, so no display is required.
